name: app-sync-guidelines

# Keeps an app's copy of the shared files current with
# pkgforge-apps/.github. When the sync changes anything, the result is
# pushed to one branch and offered as a pull request, refreshed on every
# run until it is merged. Called from the app's sync-guidelines.yml.
on:
  workflow_call:

permissions: {}

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      BRANCH: chore/sync-guidelines
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/sync-guidelines.sh
      - name: Offer the result as a pull request
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "already in sync"
            exit 0
          fi
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "chore: sync shared guidelines"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --title "chore: sync shared guidelines" \
              --body "Brings the shared guidelines, skills, scripts and workflows up to date with pkgforge-apps/.github."
          fi
          # A branch pushed with GITHUB_TOKEN starts no pull_request run,
          # but workflow_dispatch is exempt from that rule.
          gh workflow run ci.yml --ref "$BRANCH"
