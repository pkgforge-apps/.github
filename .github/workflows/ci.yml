name: ci

# Checks the shared files before they reach every app: the scripts with
# shellcheck, every workflow, the app callers included, with actionlint,
# and the ASCII rule.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck -s sh app/scripts/*.sh agents/skills/*/*.sh
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color .github/workflows/*.yml app/.github/workflows/*.yml
      - name: ASCII only
        run: |
          if LC_ALL=C grep -rnI '[^[:print:][:space:]]' . --exclude-dir=.git; then
            echo "non-ASCII bytes found; see the lines above" >&2
            exit 1
          fi
