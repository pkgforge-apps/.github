name: app-release

# Builds every asset of a draft release, attaches them, and publishes it.
# Called from the app's release.yml, which release-plz starts with the tag
# it created and which can be run by hand to retry a failed build.
#
# The organization makes published releases immutable: nothing can be
# added to one. release-plz therefore creates the release as a draft,
# and it is published only once every asset is attached.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag of the release to build
        required: true
        type: string
      onelf-version:
        description: onelf release to pack the Linux bundles with; empty for the pinned one
        required: false
        type: string
        default: ""
    secrets:
      # Read by the onelf job from the app's `release` environment. A
      # reusable workflow sees an environment secret only when the caller
      # passes it, even though it never holds the value itself.
      ONELF_SIGNING_KEY:
        required: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    permissions:
      # A draft release is visible only to a token that can push.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      appimage: ${{ steps.appimage.outputs.appimage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Check the release is still a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$draft" != true ]; then
            echo "$TAG is published, so it is immutable and takes no assets; cut a new release" >&2
            exit 1
          fi
      - id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
      - id: appimage
        run: |
          appimage=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[0].metadata.pkgforge.appimage // false')
          echo "appimage=$appimage" >> "$GITHUB_OUTPUT"

  # The Linux archive, the macOS disk image and the Windows executable.
  # Linux builds on the oldest supported Ubuntu for a low glibc floor; the
  # binary loads the display and GPU libraries at runtime.
  build:
    name: build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: x86_64-linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { platform: aarch64-linux, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { platform: x86_64-macos, os: macos-latest, target: x86_64-apple-darwin }
          - { platform: aarch64-macos, os: macos-latest, target: aarch64-apple-darwin }
          - { platform: x86_64-windows, os: windows-latest, target: x86_64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      # The C runtime goes into the .exe, so it runs on a Windows without
      # the Visual C++ Redistributable, as ripgrep, uv and Neovide do. Set
      # for that target alone, it leaves an app's own rustflags elsewhere.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target "$TARGET" && rustup default stable
      # An app that links a system library lists its Debian packages in
      # .github/apt-packages.txt, the same file CI reads.
      - name: Install the system libraries this app links against
        if: runner.os == 'Linux'
        run: |
          file=.github/apt-packages.txt
          [ -f "$file" ] || exit 0
          packages=$(sed -e 's/#.*//' "$file" | xargs)
          [ -n "$packages" ] || exit 0
          sudo apt-get update
          # shellcheck disable=SC2086 # the list is meant to split
          sudo apt-get install -y --no-install-recommends $packages
      - run: cargo build --release --locked --target "$TARGET"
      - run: sh scripts/package.sh "$TARGET" "$PLATFORM" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # The portable Linux bundle. It is built on Arch, as a glibc and loader
  # bundled from Ubuntu did not run on other systems. onelf carries every
  # library the binary loads, Mesa included unless the app's onelf.toml
  # turns it off: the Mesa built without LLVM by onelf-pkgs/mesa, put in
  # place of Arch's before the bundle is built.
  onelf:
    name: onelf ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.image }}
    # The signing secret lives in the app's `release` environment, which
    # only main may use; provision-apps in pkgforge-apps/.github creates it.
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            os: ubuntu-latest
            image: archlinux:latest@sha256:e43f1fd80e073992c5f173efbbbf65144170bf60aeb7369940087d63eacea8f4
            onelf-sha256: 72b7d55ae01dc7ec736c3dd072bc3781ea66833bf7a5ac4d9cea4a9abe60b597
            mesa-sha256: 0a9c2b015c7c848f5d64d5fd871b4ee39acded90e210ec24626f95fffe53c50e
          - platform: aarch64-linux
            os: ubuntu-24.04-arm
            image: menci/archlinuxarm:latest@sha256:a3330643ab216afdeb1a15b78925e90f370484a49b5a220f8d617f4b443701b8
            onelf-sha256: 413e278a47c718e50a58db17f57c8974055628dffd1a586c72e3789129ef297e
            mesa-sha256: 4c86a13e2e5b5ae43a9de584dbee48d4aec32c145ecc5ec6d76fe1ba52040063
    env:
      # The onelf release whose binaries the matrix pins by SHA-256. Bump
      # the two together.
      PINNED_ONELF_VERSION: 0.5.0
      PINNED_ONELF_SHA256: ${{ matrix.onelf-sha256 }}
      ONELF_VERSION: ${{ inputs.onelf-version }}
      # The onelf-pkgs/mesa release whose GL trees the matrix pins by
      # SHA-256. Bump the three together.
      MESA_RELEASE: v26.2.5-1
      MESA_SHA256: ${{ matrix.mesa-sha256 }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      # libalpm aborts a transfer that drops under a byte a second for ten
      # seconds, and a stalled `.sig` cannot fail over to the next server,
      # since the signature payload carries no server list. The mirror
      # behind ghcr.mirror.archlinux.pkgforge.dev stalls under load, so a
      # transaction fails on its own account. `--needed` makes a retry
      # after a partial install cheap. See pkgforge-dev/mirror-archlinux#76.
      - name: Install build packages
        run: |
          retry() {
            attempt=0
            while ! "$@"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 3 ]; then
                echo "$* failed $attempt times" >&2
                return 1
              fi
              echo "$* failed, retrying ($attempt/3)" >&2
              sleep 10
            done
          }
          retry pacman -Syu --disable-sandbox --noconfirm --needed \
            base-devel git rustup patchelf wayland libxkbcommon libxkbcommon-x11 \
            libx11 libxcursor libxi libxrandr mesa jq xorg-server-xvfb xorg-xauth
      # Checked out first, so the next step finds the app's package list;
      # its packages go in before the Mesa swap, so none can pull Arch's
      # Mesa back over it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      # An app that links a system library lists its Arch packages, one per
      # line, in .github/pacman-packages.txt. An app without that file
      # builds exactly as before.
      - name: Install the system libraries this app links against
        run: |
          file=.github/pacman-packages.txt
          [ -f "$file" ] || exit 0
          packages=$(sed -e 's/#.*//' "$file" | xargs)
          [ -n "$packages" ] || exit 0
          retry() {
            attempt=0
            while ! "$@"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 3 ]; then
                echo "$* failed $attempt times" >&2
                return 1
              fi
              echo "$* failed, retrying ($attempt/3)" >&2
              sleep 10
            done
          }
          # shellcheck disable=SC2086 # the list is meant to split
          retry pacman -S --disable-sandbox --noconfirm --needed $packages
      # Arch's package stays only for the libraries Mesa needs. Its own
      # files give way to onelf-pkgs' Mesa, and the tree adds whatever its
      # drivers need that Arch lacks without replacing what Arch has.
      - name: Install onelf-pkgs Mesa
        run: |
          tree="gl-${PLATFORM%-linux}.tar.zst"
          curl -fsSL -o "/tmp/$tree" \
            "https://github.com/onelf-pkgs/mesa/releases/download/$MESA_RELEASE/$tree"
          echo "$MESA_SHA256  /tmp/$tree" | sha256sum -c -
          mkdir /tmp/gl
          tar --zstd -xf "/tmp/$tree" -C /tmp/gl
          retry() {
            attempt=0
            while ! "$@"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 3 ]; then
                echo "$* failed $attempt times" >&2
                return 1
              fi
              echo "$* failed, retrying ($attempt/3)" >&2
              sleep 10
            done
          }
          retry pacman -Rdd --disable-sandbox --noconfirm mesa
          cp -an /tmp/gl/lib/. /usr/lib/
          cp -an /tmp/gl/share/. /usr/share/
          ldconfig
      - run: rustup default stable
      - run: cargo build --release --locked
      # Another version than the pinned one is checked against the digest
      # GitHub lists for its asset, which catches a corrupted download but
      # trusts the release as published.
      - name: Install onelf
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${ONELF_VERSION:-$PINNED_ONELF_VERSION}
          case $version in
          '' | *[!0-9A-Za-z.-]*)
            echo "not an onelf version: $version" >&2
            exit 1
            ;;
          esac
          asset="onelf-$PLATFORM"
          if [ "$version" = "$PINNED_ONELF_VERSION" ]; then
            sha256=$PINNED_ONELF_SHA256
          else
            sha256=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/QaidVoid/onelf/releases/tags/$version" |
              jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest' |
              sed -n 's/^sha256://p')
          fi
          if [ -z "$sha256" ]; then
            echo "onelf $version has no $asset with a SHA-256 digest" >&2
            exit 1
          fi
          curl -fsSL -o /usr/local/bin/onelf \
            "https://github.com/QaidVoid/onelf/releases/download/$version/$asset"
          echo "$sha256  /usr/local/bin/onelf" | sha256sum -c -
          chmod +x /usr/local/bin/onelf
          onelf --version
      - run: sh scripts/package-onelf.sh "$PLATFORM" "$VERSION"
      # The bundle updates itself from this release's asset. An app with its
      # update key signs it here, and the signature is published beside the
      # bundle, where the runtime looks for it. Without the key the bundle
      # updates unsigned and there is nothing to sign.
      - name: Sign the bundle for self-update
        env:
          ONELF_SIGNING_KEY: ${{ secrets.ONELF_SIGNING_KEY }}
        run: |
          [ -f packaging/onelf/update.pub ] || exit 0
          if [ -z "$ONELF_SIGNING_KEY" ]; then
            echo "packaging/onelf/update.pub is set, but the release environment has no ONELF_SIGNING_KEY" >&2
            exit 1
          fi
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s' "$ONELF_SIGNING_KEY" | base64 -d > "$key"
          onelf sign dist/*.onelf --key "$key"
      - name: Smoke run the bundle
        run: xvfb-run -a timeout 60 dist/*.onelf --smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-onelf-${{ matrix.platform }}
          path: |
            dist/*.onelf
            dist/*.onelf.sig
          if-no-files-found: error

  # The Anylinux AppImage, for an app whose Cargo.toml sets `appimage =
  # true` under [package.metadata.pkgforge]. It carries the debloated
  # Arch packages, which are much smaller than Arch's own.
  appimage:
    name: appimage ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.appimage == 'true'
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest@sha256:782f92dd4cd2adee5544ec7fc53d06a9168489041fae13271b418123c858d5e7
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The name says what the file is: an Anylinux AppImage runs on any
        # distribution, so it is not named after one. The runners are
        # pinned rather than `-latest`: the image carries the container's
        # glibc and loader, so a runner image bump must be deliberate.
        include:
          - { platform: anylinux-x86_64, os: ubuntu-24.04 }
          - { platform: anylinux-aarch64, os: ubuntu-24.04-arm }
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      # The Anylinux-AppImages commit the packaging tools come from.
      # quick-sharun pins the tools it downloads in turn.
      QUICK_SHARUN: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/c28bb80743106fdf08cb10fb27d19d9932eb0865/useful-tools/quick-sharun.sh
      DEBLOATED_PACKAGES: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/c28bb80743106fdf08cb10fb27d19d9932eb0865/useful-tools/get-debloated-pkgs.sh
      MAKE_AUR_PACKAGE: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/c28bb80743106fdf08cb10fb27d19d9932eb0865/useful-tools/make-aur-package.sh
    steps:
      - uses: pkgforge-dev/anylinux-setup-action@ba7321e11074f9e387a0634e653d09b115d576cd # v6
      # The setup action leaves the toolchain out, and a pacman transaction
      # needs the same retry here as in the onelf job; see its comment.
      - name: Install build packages
        run: |
          retry() {
            attempt=0
            while ! "$@"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 3 ]; then
                echo "$* failed $attempt times" >&2
                return 1
              fi
              echo "$* failed, retrying ($attempt/3)" >&2
              sleep 10
            done
          }
          retry pacman -S --noconfirm --needed rustup wayland libxkbcommon \
            libxkbcommon-x11 libx11 libxcursor libxi libxrandr xorg-xauth
          get-debloated-pkgs --add-common --prefer-nano
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      # An app that links a system library lists its Arch packages, one per
      # line, in .github/pacman-packages.txt. An app without that file
      # builds exactly as before.
      - name: Install the system libraries this app links against
        run: |
          file=.github/pacman-packages.txt
          [ -f "$file" ] || exit 0
          packages=$(sed -e 's/#.*//' "$file" | xargs)
          [ -n "$packages" ] || exit 0
          retry() {
            attempt=0
            while ! "$@"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 3 ]; then
                echo "$* failed $attempt times" >&2
                return 1
              fi
              echo "$* failed, retrying ($attempt/3)" >&2
              sleep 10
            done
          }
          # shellcheck disable=SC2086 # the list is meant to split
          retry pacman -S --disable-sandbox --noconfirm --needed $packages
      - run: rustup default stable
      - run: cargo build --release --locked
      - run: sh scripts/package-appimage.sh "$PLATFORM" "$VERSION"
      - name: Smoke run the AppImage
        run: xvfb-run -a timeout 60 dist/*.AppImage --smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-appimage-${{ matrix.platform }}
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
          if-no-files-found: error

  # Uploads every asset at once, so a release never ends up with some
  # platforms missing. Re-running the failed jobs finishes it. The
  # AppImage job is skipped for an app that ships none.
  publish:
    name: publish
    needs: [build, onelf, appimage]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
